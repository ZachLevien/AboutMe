[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-bulk-delete"
version = "0.1.0"
description = "Bulk-delete old Gmail messages by date, preserving labeled, important, and starred mail."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zach Levien" }]
keywords = ["gmail", "email", "cleanup", "cli"]
dependencies = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gmail-bulk-delete = "gmail_bulk_delete.cli:main"

[tool.setuptools.packages.find]
include = ["gmail_bulk_delete*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
